<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi perdoni?</title>
<style>
  :root{
    --blush: #ffe3ea;
    --blush-deep: #ffc2d1;
    --ink: #4a2438;
    --plum: #8a3b5e;
    --yes: #ff5d8f;
    --yes-dark: #e04479;
    --gold: #ffcf6b;
    --paper: #fff8f5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family: -apple-system, "SF Pro Rounded", "Helvetica Neue", sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--blush) 0%, var(--blush-deep) 100%);
    touch-action: manipulation;
  }
  #stage{
    position: relative;
    width: 100%;
    height: 100dvh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card{
    background: var(--paper);
    border-radius: 32px;
    padding: 36px 26px 44px;
    width: 100%;
    max-width: 380px;
    text-align:center;
    box-shadow: 0 20px 50px rgba(138,59,94,0.25);
    position:relative;
    z-index: 2;
  }
  .eyebrow{
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--plum);
    opacity: 0.65;
    font-weight: 700;
    margin-bottom: 10px;
  }
  h1{
    font-size: 34px;
    line-height: 1.15;
    color: var(--ink);
    margin: 0 0 8px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .sub{
    font-size: 15px;
    color: var(--plum);
    opacity: 0.75;
    margin: 0 0 30px;
    min-height: 20px;
    font-weight: 500;
  }
  .buttons{
    position: relative;
    display:flex;
    gap: 16px;
    justify-content:center;
    align-items:center;
    height: 64px;
  }
  button{
    border:none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 800;
    padding: 16px 30px;
    cursor:pointer;
    font-family: inherit;
  }
  #yesBtn{
    background: linear-gradient(135deg, var(--yes), var(--yes-dark));
    color: white;
    box-shadow: 0 10px 24px rgba(224,68,121,0.45);
    transition: transform 0.18s ease;
  }
  #yesBtn:active{ transform: scale(0.94); }
  #noBtn{
    background: var(--blush);
    color: var(--plum);
    box-shadow: 0 6px 14px rgba(138,59,94,0.15);
    position: fixed;
    transition: top 0.18s cubic-bezier(.2,1.4,.5,1), left 0.18s cubic-bezier(.2,1.4,.5,1), transform 0.18s;
  }
  .counter{
    margin-top: 22px;
    font-size: 13px;
    color: var(--plum);
    opacity: 0.55;
    font-weight: 600;
  }

  /* Celebration overlay */
  #party{
    position: fixed;
    inset: 0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 30%, #fff3e0 0%, var(--gold) 120%);
    z-index: 10;
    text-align:center;
    padding: 24px;
    overflow:hidden;
  }
  #party.show{ display:flex; }
  #party h2{
    font-size: 30px;
    color: var(--plum);
    margin: 0 0 6px;
    font-weight: 800;
    z-index: 3;
  }
  #party p{
    color: var(--ink);
    opacity: 0.7;
    margin: 0 0 10px;
    font-weight: 600;
    z-index: 3;
  }
  .cats{
    font-size: 48px;
    z-index: 3;
    display:flex;
    gap: 6px;
  }
  .cats span{
    display:inline-block;
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  .cats span:nth-child(2){ animation-delay: 0.15s; }
  .cats span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    from{ transform: translateY(0) rotate(-6deg); }
    to{ transform: translateY(-18px) rotate(6deg); }
  }
  .confetti{
    position:absolute;
    top:-10%;
    width:10px;
    height:16px;
    opacity:0.9;
    animation: fall linear infinite;
    z-index:2;
    border-radius: 2px;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(360deg); }
  }
  #soundHint{
    margin-top: 14px;
    font-size: 12px;
    color: var(--plum);
    opacity: 0.5;
    z-index: 3;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="card">
    <div class="eyebrow">Una domanda seria</div>
    <h1>Mi perdoni?</h1>
    <p class="sub" id="subtext">Prendi tempo, ma rispondi bene.</p>
    <div class="buttons">
      <button id="yesBtn">Sì 💕</button>
      <button id="noBtn">No</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<div id="party">
  <div class="cats">
    <span>🐱</span><span>😻</span><span>🐈</span>
  </div>
  <h2>Evviva!! 🎉</h2>
  <p>Lo sapevo che mi perdonavi.</p>
  <div id="soundHint">tocca lo schermo per la musica 🔊</div>
</div>

<script>
(function(){
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const counterEl = document.getElementById('counter');
  const subtext = document.getElementById('subtext');
  const party = document.getElementById('party');
  const stage = document.getElementById('stage');

  const messages = [
    "Dai, non scappare così.",
    "Il bottone No è timido.",
    "Ha paura di essere premuto.",
    "Continua a muoversi, eh?",
    "Forse è un segno del destino.",
    "Sì è molto più comodo, guarda.",
    "Il No ormai si è arreso a nascondersi.",
    "A questo punto tanto vale dire Sì."
  ];

  let attempts = 0;
  let btnW = 0, btnH = 0;

  function placeInitial(){
    const rect = noBtn.getBoundingClientRect();
    btnW = rect.width;
    btnH = rect.height;
    noBtn.style.left = rect.left + 'px';
    noBtn.style.top = rect.top + 'px';
  }

  function dodge(){
    attempts++;
    const margin = 16;
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;
    const x = margin + Math.random() * Math.max(1, (maxX - margin));
    const y = margin + Math.random() * Math.max(1, (maxY - margin));
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    // Sì diventa un pochino più grande a ogni tentativo, gentile incoraggiamento
    const scale = Math.min(1.35, 1 + attempts * 0.03);
    yesBtn.style.transform = 'scale(' + scale + ')';

    if(attempts <= messages.length){
      subtext.textContent = messages[attempts - 1];
    } else {
      subtext.textContent = "Tentativo numero " + attempts + ". Rispetto la costanza.";
    }
    counterEl.textContent = attempts === 1 ? "1 tentativo di dire no" : (attempts + " tentativi di dire no");
  }

  // Attiva la fuga sia al passaggio del mouse/dito sia al tocco/click
  noBtn.addEventListener('pointerenter', dodge);
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });

  window.addEventListener('resize', function(){
    btnW = noBtn.getBoundingClientRect().width;
    btnH = noBtn.getBoundingClientRect().height;
  });

  window.addEventListener('load', placeInitial);
  placeInitial();

  // --- Festa con musica sintetizzata ---
  let audioCtx = null;
  function playHappyTune(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      // melodia allegra semplice (arpeggio in loop breve)
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]; // C5 E5 G5 C6 G5 E5
      const now = audioCtx.currentTime;
      const noteDur = 0.16;

      notes.forEach(function(freq, i){
        const t = now + i * noteDur;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + noteDur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + noteDur);
      });

      // ripete il giro un paio di volte
      setTimeout(function(){ if(party.classList.contains('show')) playHappyTune(); }, notes.length * noteDur * 1000 + 350);
    }catch(err){
      // audio non disponibile, nessun problema
    }
  }

  function spawnConfetti(){
    const colors = ['#ff5d8f','#ffcf6b','#8a3b5e','#ffffff','#ff9fc0'];
    for(let i=0; i<60; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = (Math.random()*100) + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2.4 + Math.random()*2.2) + 's';
      piece.style.animationDelay = (Math.random()*1.5) + 's';
      party.appendChild(piece);
    }
  }

  yesBtn.addEventListener('click', function(){
    party.classList.add('show');
    spawnConfetti();
    playHappyTune();
  });

  party.addEventListener('click', playHappyTune);
  party.addEventListener('touchstart', playHappyTune);
})();
</script>

</body>
</html>
